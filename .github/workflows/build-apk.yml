name: Build APK

# Branche de build pour Musync 2.15.0 : GitHub sert uniquement de machine
# de compilation (le développement se fait sur la copie locale).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Version épinglée, pas `channel: stable` : le 2026-11-12, stable
      # est passé à Flutter 3.50, qui déprécie `package:flutter/material.dart`
      # (49 infos `deprecated_member_use`) et casse `analyze --fatal-infos`
      # alors que le code n'a pas changé. Le projet est développé et testé
      # contre 3.47.6 : la CI doit compiler avec la même version.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      # An APK is not a release until both static analysis and tests pass.
      - name: Analyze Dart
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Secret de signature obligatoire manquant : $variable"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/musync-release.jks
          if [ ! -s android/app/musync-release.jks ]; then
            echo "::error::Keystore de release vide."
            exit 1
          fi
          cat > android/key.properties <<PROPEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=musync-release.jks
          PROPEOF
          echo "Signature release configurée."

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musync-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

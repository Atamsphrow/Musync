name: Build APK

# Branche de build pour Musync 2.15.0 : GitHub sert uniquement de machine
# de compilation (le développement se fait sur la copie locale).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aucun keystore configuré : la release sera signée avec la clé debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/musync-release.jks
          cat > android/key.properties <<PROPEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=musync-release.jks
          PROPEOF
          echo "Signature release configurée."

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musync-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

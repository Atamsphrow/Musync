name: musync
description: "Musync — Lecteur de musique local et gestionnaire de paroles synchronisées"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Material You — wallpaper-derived color scheme (Android 12+)
  dynamic_color: ^1.7.0

  # Audio playback
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  just_audio_background: ^0.0.1-beta.14

  # Music library scan (MediaStore).
  #
  # Unmaintained since May 2023, and its Android module predates the `namespace`
  # that AGP 8+ requires — so the build needs the shim in
  # `android/build.gradle.kts`. Kept anyway: `on_audio_query_forked` looks like
  # the way out but is broken as published (its Android module declares
  # `implements: on_audio_query`, so it can never resolve as the fork's own
  # implementation). Replacing this with a small MediaStore platform channel is
  # the real fix if it ever breaks again.
  on_audio_query: ^2.9.0

  # Networking
  http: ^1.3.0

  # Permissions
  permission_handler: ^11.4.0

  # File paths
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
